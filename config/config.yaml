# =============================================================================
# Cerner TAT Scraper — configuration
#
# This file controls how reports are read and classified. You normally only need
# to edit THIS file (not the code) to adapt the tool to your site's reports.
#
# Matching everywhere is CASE-INSENSITIVE and ignores extra spaces and most
# punctuation, so "Order Date/Time" and "order date time" are treated the same.
# =============================================================================

# -----------------------------------------------------------------------------
# COLUMN ALIASES
# Map each canonical field the tool understands to the header text(s) that may
# appear in your report. Add/remove aliases to match your exact headers.
# Leave a field's list empty if your report doesn't have it.
# -----------------------------------------------------------------------------
columns:
  # --- identity (optional, used only on the Detail sheet) ---
  patient_name:   ["patient", "patient name", "name"]
  mrn:            ["mrn", "medical record number", "fin", "fin nbr"]
  accession:      ["accession", "accession number", "specimen id", "specimen"]

  # --- the test / order being performed (REQUIRED for classification) ---
  test_name:      ["test", "test name", "order", "order name", "procedure", "orderable"]

  # --- timestamps (used to COMPUTE any TAT columns that aren't already present) ---
  order_time:     ["order date/time", "ordered", "order time", "order dt/tm", "ordered date/time"]
  collected_time: ["collected", "collection date/time", "collect dt/tm", "collected dt/tm", "collected date/time"]
  received_time:  ["received", "lab received", "received in lab", "receive dt/tm", "received date/time"]
  complete_time:  ["completed", "complete date/time", "result date/time", "verified", "complete dt/tm", "resulted"]

  # --- direct TAT columns (in your reports). If present, used as-is; otherwise
  #     computed from the timestamps above. Values may be minutes (e.g. "83"),
  #     "H:MM" / "HH:MM:SS", or "1d 2h 3m" style strings. ---
  tat_order_to_collected:  ["order to collected", "order to collect"]
  tat_collected_to_lab:    ["collected to lab", "collect to received", "collected to received"]
  tat_collected_to_complete: ["collected to complete", "collect to complete"]
  tat_lab_to_complete:     ["lab to complete", "received to complete"]
  tat_order_to_complete:   ["order to complete"]

# -----------------------------------------------------------------------------
# PASTED-TEXT / PLAIN-TEXT LAYOUT
# Cerner's TAT report copied out of the viewer (or a text-based PDF) arrives as
# one field per line with NO headers, so fields are read by position. Each test
# is a block of: test name, (optional) priority code, the timestamps below in
# order, then the TAT values below in order. Reorder these lists if your report's
# column order differs.
# -----------------------------------------------------------------------------
text_layout:
  datetime_fields:
    - order_time
    - collected_time
    - received_time
    - complete_time
  tat_fields:
    - tat_order_to_collected
    - tat_collected_to_lab
    - tat_collected_to_complete
    - tat_lab_to_complete
    - tat_order_to_complete
  # Lines treated as a priority/class code (not part of the test name).
  priority_codes: ["ST", "RT", "STAT", "ROUTINE", "TIMED", "PREOP", "NOW", "ASAP", "TODAY", "RN", "UN"]

  # Patient / encounter header lines to DISCARD when pasting a whole report that
  # is grouped by patient. These lines look like:
  #     6000788 SURNAME,FIRSTNAME EMERGENCY
  # i.e. an MRN, then "LASTNAME,FIRSTNAME", then a location/encounter class.
  # The matching line is dropped entirely (name and MRN are never written to
  # output); the tool only counts how many distinct patients appear. Set to an
  # empty value ("") to disable this and paste test/TAT data only.
  patient_header_pattern: "^\\d{4,}\\s+.+,.+"

  # Fallback patient dividers: when there's no MRN + name header, a bare marker
  # line can still separate patients. Any line matching one of these (whole line,
  # case-insensitive, punctuation ignored) starts a new patient and is discarded.
  patient_delimiters: ["PATIENT"]

# -----------------------------------------------------------------------------
# PRIVACY
# When deidentify is true (recommended), no patient name, MRN, or accession is
# ever written to the spreadsheet. Each patient is shown only as an anonymized
# "Patient N" label so you can still see which tests share a patient and get a
# patient count — with zero PHI in the output file.
# -----------------------------------------------------------------------------
privacy:
  deidentify: true

  # Data minimization. Turn these off to keep the output as lean as possible —
  # useful if the spreadsheets are shared beyond the lab. Counts and averaged TAT
  # never contain PHI regardless.
  #   include_detail_sheet: write the per-test Detail sheet at all.
  #   include_timestamps:   include exact order/collect/receive/complete times on
  #                         the Detail sheet (a specific time + test can be a
  #                         quasi-identifier for a small patient set).
  include_detail_sheet: true
  include_timestamps: true

# -----------------------------------------------------------------------------
# ANALYSIS
# Outlier handling for the averaged TAT metrics.
# -----------------------------------------------------------------------------
analysis:
  # Exclude any single TAT value greater than this many minutes from the
  # AVERAGES (e.g. urine cultures that take thousands of minutes and would
  # otherwise skew the numbers). The raw values still appear on the Detail sheet;
  # they're just left out of the averaged metrics, and the count of excluded
  # values is reported on the Summary sheet. Set to null / empty to disable.
  tat_cap_minutes: 500

# -----------------------------------------------------------------------------
# DAILY (WIDE) SUMMARY
# Produces a single row per report — columns = metrics — designed to stack into a
# running, day-over-day tracking sheet (the "Daily Summary" sheet, and the
# optional master workbook). Trim the lists below to control how wide it gets.
# -----------------------------------------------------------------------------
daily_summary:
  enabled: true

  # TAT metrics to include per group. NOTE: two of the five canonical metrics are
  # exact sums of the others, so they're omitted by default (they add no info):
  #   collected_to_complete = collected_to_lab + lab_to_complete
  #   order_to_complete      = order_to_collected + collected_to_lab + lab_to_complete
  # The default keeps the three independent phases plus the order→complete total.
  metrics:
    - tat_order_to_collected
    - tat_collected_to_lab
    - tat_lab_to_complete
    - tat_order_to_complete

  # How TAT columns are grouped. Each group lists the test categories it covers.
  # Default mirrors the lab's Blood-vs-Urine split (blood draws vs urinalysis).
  # To get a TAT column set per test type instead, list all five categories as
  # their own groups.
  tat_groups:
    Blood: [CBC, Chemistry, Cardiac, Coagulation]
    Urine: [Urinalysis]

  # Shift columns to include. Use your day/night labels and/or "Overall".
  # Overall is dropped by default because it's derivable from Day + Night.
  shifts: [Day, Night]

  # Per-type count columns (CBC, Chemistry, …, Total) and the patient count.
  include_counts: true
  include_patient_count: true

# -----------------------------------------------------------------------------
# SHIFTS
# Day shift runs [day_start, night_start); everything else is Night.
# `basis` chooses which timestamp decides the shift a test belongs to.
#   one of: collected_time, order_time, received_time, complete_time
# -----------------------------------------------------------------------------
shifts:
  day_start:   "07:00"
  night_start: "19:00"
  day_label:   "Day"
  night_label: "Night"
  basis: collected_time

# -----------------------------------------------------------------------------
# TEST CLASSIFICATION
# Each record's test name is matched against the categories IN ORDER; the first
# category with a matching pattern wins. Patterns are regular expressions,
# matched case-insensitively. \b means a word boundary (so "\bpt\b" matches the
# standalone test "PT" but not "PTT" or "Platelet").
# Tweak these lists so your local orderable names land in the right bucket.
# -----------------------------------------------------------------------------
classification:
  categories:
    - name: Cardiac
      patterns:
        - "troponin"
        - "\\btrop\\b"
        - "\\bbnp\\b"
        - "nt-?probnp"
        - "ck-?mb"

    - name: Coagulation
      patterns:
        - "\\bpt\\b"
        - "prothrombin"
        - "\\bptt\\b"
        - "\\baptt\\b"
        - "\\binr\\b"
        - "d-?dimer"
        - "fibrinogen"

    - name: CBC
      patterns:
        - "\\bcbc\\b"
        - "complete blood count"
        - "hemogram"
        - "\\bh\\s*&\\s*h\\b"
        - "hgb\\s*/\\s*hct"
        - "differential"
        - "\\bdiff\\b"
        - "\\bwbc\\b"
        - "\\bplatelet\\b"

    - name: Urinalysis
      patterns:
        - "urinalysis"
        - "\\bua\\b"
        - "\\bu\\s*/\\s*a\\b"
        - "urine"

    - name: Chemistry
      patterns:
        - "\\bbmp\\b"
        - "\\bcmp\\b"
        - "metabolic panel"
        - "electrolyte"
        - "\\bbun\\b"
        - "creatinine"
        - "glucose"
        - "\\blft\\b"
        - "hepatic"
        - "\\bmag\\b"
        - "magnesium"
        - "phosph"
        - "calcium"
        - "\\blactate\\b"
        - "chemistry"

  # Bucket for test names that match no category above.
  default: Other
