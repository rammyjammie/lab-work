[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cerner-tat-scraper"
version = "0.1.0"
description = "Local, offline tool to turn Cerner HTML/PDF lab reports into a TAT spreadsheet."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pdfplumber>=0.10",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
cerner-tat = "cerner_tat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
